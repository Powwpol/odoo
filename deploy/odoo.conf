[options]
; ================================================================
; Odoo 19 Configuration - MCP Server Deployment
; ================================================================

; Database
db_host = localhost
db_port = 5432
db_user = odoo
db_password = odoo
; db_name = odoo19

; Paths - IMPORTANT: include custom-addons
addons_path = addons,custom-addons

; Server
http_port = 8069
; longpolling_port = 8072
; proxy_mode = True

; Performance
workers = 0
; workers = 4
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200

; Logging
log_level = info
; logfile = /var/log/odoo/odoo.log

; Security
; admin_passwd = CHANGE_ME
list_db = True

; Default apps
default_productivity_apps = True
